line-length = 100
target-version = "py314"
extend-exclude = [".smoke"]

[lint]
# Pinned explicitly: newer ruff releases widen the default set, and CI should
# not start failing because the linter was upgraded underneath it.
select = ["E4", "E7", "E9", "F", "B", "I"]
# zip(..., strict=) would change runtime behaviour in the research code for no
# gain -- every zip there pairs columns of one DataFrame.
ignore = ["B905"]
